<!--标准文件开头, 通常无需更改-->
<!DOCTYPE html>
<html lang="en">

<head>
  <!--meta是所有html共用的规则-->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!--加载google font字体文件-->
  <link href="https://fonts.googleapis.com/css2?family=Inter&family=Montserrat:wght@600&display=swap" rel="stylesheet">

  <!--加载css, 每个页面有公共和非公共的内容 (js在body尾部加载)-->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/darkmode.css">
  <link rel="stylesheet" href="css/blog.css">

  <!--在browser tab显示, 每个页面需要设置不同的title-->
  <title>Ling Xu | Blog</title>
  <link rel="icon" href="assets/icon_file/logo.ico" sizes="any">

</head>

<body>
  <!--动态背景容器, style.css和background.js-->
  <canvas id="fractalCanvas"></canvas>

  <!--导航栏, style.css, background.js和darkmode.js-->
  <nav class="navbar"> 
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="project.html">Project</a>
        <a href="blog.html">Blog</a>
        <a href="about.html">About</a>
    </div>
    
    <div class="nav-button">
        <button id="theme-toggle">
            <img src="assets/icon_file/lightmode.png" alt="Toggle theme" class="icon">
        </button>
        <button id="background-toggle">
            <img src="assets/icon_file/fractal open.png" alt="Toggle fractal" class="icon">
        </button>
    </div>
  </nav>

  <!--主题内容容器, 便于响应式布局, style.css-->
  <div class="container">
  
    <header>

      <h1>
        Blog
      </h1>

      <!--简要说明-->
      <!--TODO: 重新撰写简介-->
      <p> 
        Here are my blog posts. Click a tag to filter, or double-click to clear the selection.
      </p>

    </header>

    <!--主要内容-->
    <main>

        <!--放置筛选用的标签-->
        <div id="filters">
            <div id="lang-filter"></div>
            <div id="cat-filter"></div>
        </div>

        <!--放置博客列表-->
        <div id="blog-container"></div>

    </main>

    <!--脚注-->
    <footer class="site-footer">
        &copy; 2025 Xu Ling. All rights reserved.
    </footer>

  </div>

  <!--脚本-->
  <script src="js/darkmode.js"></script>
  <script src="js/background.js"></script>
  <script src="js/blog.js"></script>

</body>
</html>
